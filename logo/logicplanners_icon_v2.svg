<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background, matches site cream + gold border -->
  <rect x="12" y="12" width="488" height="488" rx="104" ry="104" fill="#FAF7F4" stroke="#C9A96E" stroke-width="8"/>

  <g transform="rotate(-6 256 256)">
    <!-- Back cover (periwinkle, peeking) -->
    <rect x="148" y="124" width="206" height="262" rx="18" fill="#6D89C2"/>
    <!-- Page block -->
    <rect x="166" y="112" width="194" height="258" rx="13" fill="#FFFDF8" stroke="#EADFD0" stroke-width="2"/>

    <!-- Handwritten checklist -->
    <path d="M188,196 L196,205 L211,186" fill="none" stroke="#7A9E87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="194" width="100" height="6" rx="3" fill="#E7DACB"/>

    <path d="M188,242 L196,251 L211,232" fill="none" stroke="#7A9E87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="240" width="84" height="6" rx="3" fill="#E7DACB"/>

    <path d="M188,288 L196,297 L211,278" fill="none" stroke="#7A9E87" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="222" y="286" width="92" height="6" rx="3" fill="#E7DACB"/>

    <!-- Ribbon bookmark with notched tail -->
    <path d="M294,108 L326,108 L326,406 L310,432 L294,406 Z" fill="#B76A5E"/>

    <!-- Pressed-flower charm at ribbon top -->
    <g>
      <ellipse cx="324" cy="95" rx="14" ry="8" fill="#C9A96E"/>
      <ellipse cx="319" cy="108" rx="14" ry="8" fill="#C9A96E" transform="rotate(72 319 108)"/>
      <ellipse cx="304" cy="103" rx="14" ry="8" fill="#C9A96E" transform="rotate(144 304 103)"/>
      <ellipse cx="304" cy="87" rx="14" ry="8" fill="#C9A96E" transform="rotate(216 304 87)"/>
      <ellipse cx="319" cy="82" rx="14" ry="8" fill="#C9A96E" transform="rotate(288 319 82)"/>
      <ellipse cx="285" cy="100" rx="13" ry="5" fill="#7A9E87" transform="rotate(-25 285 100)"/>
      <circle cx="310" cy="95" r="8" fill="#B76A5E"/>
    </g>
  </g>
</svg>
