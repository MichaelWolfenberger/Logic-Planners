<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!-- Background -->
  <rect x="16" y="16" width="480" height="480" rx="110" ry="110" fill="#4ECDC4"/>

  <!-- Planner notepad, slightly tilted -->
  <g transform="rotate(-8 261 255)">
    <rect x="156" y="118" width="212" height="58" rx="22" fill="#FFB199"/>
    <rect x="156" y="146" width="212" height="244" rx="18" fill="#FFF8F0"/>

    <!-- Checklist row 1 (checked) -->
    <rect x="182" y="206" width="26" height="26" rx="7" fill="#FF7E67"/>
    <path d="M189 219 L196 226 L209 211" fill="none" stroke="#FFF8F0" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
    <rect x="220" y="213" width="118" height="9" rx="4.5" fill="#BFE9E4"/>

    <!-- Checklist row 2 -->
    <rect x="182" y="256" width="26" height="26" rx="7" fill="none" stroke="#4ECDC4" stroke-width="4"/>
    <rect x="220" y="263" width="100" height="9" rx="4.5" fill="#BFE9E4"/>

    <!-- Checklist row 3 -->
    <rect x="182" y="306" width="26" height="26" rx="7" fill="none" stroke="#4ECDC4" stroke-width="4"/>
    <rect x="220" y="313" width="110" height="9" rx="4.5" fill="#BFE9E4"/>
  </g>

  <!-- Heart with heartbeat pulse, overlapping bottom-right corner -->
  <g transform="translate(248,238) scale(1.05)">
    <path d="M100,40 C100,18 80,-4 53,-4 C24,-4 8,22 8,48 C8,86 52,124 100,168 C148,124 192,86 192,48 C192,22 176,-4 147,-4 C120,-4 100,18 100,40 Z" fill="#FF7E67"/>
    <path d="M28,55 L70,55 L86,22 L108,90 L130,55 L172,55" fill="none" stroke="#FFF8F0" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
